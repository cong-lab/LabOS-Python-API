[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labos-tool-client"
version = "0.1.0"
description = "Remote WebSocket MCP-style tool client and relay examples for LabOS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "typing-extensions>=4",
    "websockets>=12",
]

[project.optional-dependencies]
examples = [
    "aiohttp>=3.9",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/labos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
